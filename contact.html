<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Jon Dean - Film & TV Editor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body class="contact-page">

  <!-- NAVIGATION HEADER -->
  <header class="navbar">
    <nav>
      <ul>
        <li><a href="index.html#home">HOME</a></li>
        <li><a href="index.html#bio">BIO</a></li>
        <li class="logo"><a href="index.html#home">JON DEAN</a></li>
        <li><a href="work.html">WORK</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO BANNER SECTION -->
  <section class="contact-hero">
    <img src="images/contact-background.png" alt="Jon Dean Contact Background" class="hero-bg-img">
    <div class="hero-overlay"></div>

    <div class="contact-hero-content">
      <h1>CUT TO DIALOGUE</h1>
      <p class="contact-intro">
        I love the opportunity to meet new people and discuss<br>
        interesting ideas, big or small. Please feel free to<br>
        get in touch.
      </p>
    </div>
  </section>

  <!-- FORM SECTION BELOW HERO -->
  <main class="contact-form-container">
    <form class="contact-form" action="https://formspree.io/f/mdaqrelb" method="POST">
      <div class="form-group">
        <label for="email">Email Address (required)</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject">
      </div>

      <div class="form-group">
        <label for="message">Message (required)</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn btn-outline">SUBMIT</button>
    </form>
  </main>

</body>
</html>
